name: Build Add-ons

on:
  push:
    branches:
      - main
    paths:
      - "**/config.yaml" # Скрипт просыпается, только если изменился config.yaml

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      changed_addons: ${{ steps.changed.outputs.addons }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get changed add-ons
        id: changed
        uses: home-assistant/actions/helpers/find-addons@master

  build:
    needs: init
    runs-on: ubuntu-latest
    if: ${{ needs.init.outputs.changed_addons != '[]' }}
    strategy:
      matrix:
        addon: ${{ fromJson(needs.init.outputs.changed_addons) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Настройка QEMU для эмуляции процессоров ARM на серверах GitHub
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Настройка нативного Docker BuildKit
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Авторизация в GitHub Container Registry (вашем ghcr.io)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Универсальная мультиархитектурная сборка и публикация
      - name: Build and push Multi-Arch Image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.addon }}
          file: ./${{ matrix.addon }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.addon }}:latest
